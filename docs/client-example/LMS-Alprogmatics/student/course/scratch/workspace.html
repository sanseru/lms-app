<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scratch Workspace | Alprogmatics</title>
    <link rel="stylesheet" href="../../assets/css/main.css?v=4" />
    <link rel="stylesheet" href="../../assets/css/course-detail.css" />
    <style>
      :root {
        --scratch-topbar-height: 52px;
        --scratch-panel-offset: 48px;
        --scratch-panel-width: 340px;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
      }

      .scratch-workspace-page {
        position: relative;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding-top: 44px;
        overflow: hidden;
        background: #f2f2f3;
      }

      .scratch-shell-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 44px;
        background: #1d2b3d;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-sizing: border-box;
        padding: 0 14px 0 10px;
        z-index: 80;
      }

      .scratch-header-left,
      .scratch-header-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .scratch-header-center {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
      }

      .scratch-header-nav {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .scratch-header-nav button {
        width: 26px;
        height: 26px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .scratch-header-nav button.active {
        background: #f39b74;
        border-color: #f39b74;
      }

      .scratch-header-nav button:disabled {
        opacity: 0.35;
        cursor: default;
      }

      .scratch-header-btn {
        height: 28px;
        padding: 0 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .scratch-header-btn.primary {
        background: #7a5ee7;
        border-color: #7a5ee7;
      }

      .scratch-header-icon {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .scratch-user-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 8px 4px 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #fff;
        font-size: 12px;
        font-weight: 700;
      }

      .scratch-user-avatar {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #ef8a4d;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
      }

      .scratch-workspace-wrap {
        position: absolute;
        inset: 44px 0 0 0;
        background: #fff;
        border: 0;
        overflow: hidden;
      }

      .scratch-editor-frame {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 0;
        border: 0;
        background: #f4f4f4;
      }

      .scratch-question-panel {
        position: absolute;
        right: 0;
        top: calc(44px + var(--scratch-panel-offset));
        z-index: 20;
        width: var(--scratch-panel-width);
        height: calc(100vh - 45px - var(--scratch-panel-offset));
        padding: 18px 18px 20px;
        box-sizing: border-box;
        background: rgba(255, 248, 244, 0.97);
        border-left: 1px solid rgba(18, 32, 52, 0.1);
        box-shadow: -10px 0 18px rgba(18, 32, 52, 0.12);
        backdrop-filter: blur(4px);
        transform: translateX(0);
        transition: transform 0.28s ease;
        overflow: visible;
      }

      .scratch-question-panel.hidden {
        transform: translateX(calc(100% + 12px));
      }

      .scratch-question-label {
        margin: 8px 0 10px;
        color: #d46a53;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      .scratch-question-panel h2 {
        margin: 0 0 10px;
        font-size: 20px;
        line-height: 1.2;
        color: #1a2332;
      }

      .scratch-question-panel p {
        margin: 0 0 10px;
        color: #445063;
        font-size: 12px;
        line-height: 1.55;
      }

      .scratch-question-panel pre {
        margin: 0;
        padding: 12px 10px;
        border-radius: 8px;
        background: #23384a;
        color: #ecf3f3;
        font-size: 11px;
        line-height: 1.6;
        white-space: pre-wrap;
        overflow: auto;
      }

      .scratch-question-toggle {
        position: absolute;
        left: -34px;
        top: 50%;
        z-index: 60;
        width: 34px;
        height: 72px;
        border: 0;
        border-radius: 0 10px 10px 0;
        background: #f39b74;
        color: #fff;
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 0.08em;
        line-height: 1;
        cursor: pointer;
        box-shadow: 0 8px 18px rgba(45, 27, 68, 0.18);
        writing-mode: vertical-rl;
        text-orientation: mixed;
        transform: translateY(-50%) rotate(180deg);
        display: grid;
        place-items: center;
        padding: 0;
      }

      .scratch-question-toggle[aria-expanded='false'] {
        left: -34px;
      }

      .scratch-question-toggle[aria-expanded='true'] {
        left: -34px;
      }

      @media (max-width: 800px) {
        .scratch-question-panel {
          width: 280px;
        }

        .scratch-question-toggle[aria-expanded='true'] {
          right: 250px;
        }
      }
    </style>
  </head>
  <body data-course="scratch">
    <header class="scratch-shell-header" aria-label="Scratch project header">
      <div class="scratch-header-left">
        <a class="scratch-header-btn" href="scratch-creator.html?lesson=0">Back</a>
      </div>

      <div class="scratch-header-center" aria-label="Question navigation">
        <nav id="scratchLessonNav" class="scratch-header-nav" aria-label="Choose a question"></nav>
      </div>

      <div class="scratch-header-right">
        <div class="scratch-header-icon" aria-hidden="true"></div>
        <div class="scratch-header-icon" aria-hidden="true"></div>
        <div class="scratch-user-chip">
          <span class="scratch-user-avatar">S</span>
          <span>scratch-cat</span>
        </div>
      </div>
    </header>

    <main class="scratch-workspace-page">
      <aside id="scratchQuestionDrawer" class="scratch-question-panel" aria-labelledby="scratch-question-title">
        <button id="scratchQuestionToggle" class="scratch-question-toggle" type="button" aria-expanded="true" aria-label="Toggle question panel">Close</button>
        <p class="scratch-question-label">Practice Questions</p>
        <h2 id="scratch-question-title">Your first blocks</h2>
        <p id="scratch-question-body">Learn coding with visual blocks that are easy to understand.</p>
        <p id="scratch-question-text">Combine event and motion blocks to make your character move.</p>
        <pre id="scratch-question-code">when green flag clicked
move 10 steps</pre>
      </aside>

      <div class="scratch-workspace-wrap">
        <iframe
          class="scratch-editor-frame"
          title="Scratch project workspace"
          src="scratch-gui/build/index.html"
          allow="fullscreen; autoplay"
        ></iframe>
      </div>
    </main>

    <script src="../../assets/js/course-lesson.js"></script>
    <script>
      const scratchLessonNav = document.getElementById('scratchLessonNav');
      if (scratchLessonNav && course) {
        scratchLessonNav.innerHTML = course.lessons.map((item, index) => `
          <button class="${index === selectedLesson ? 'active' : ''}" type="button" aria-label="Open question ${index + 1}" aria-current="${index === selectedLesson ? 'step' : 'false'}">${index + 1}</button>
        `).join('');
        scratchLessonNav.querySelectorAll('button').forEach((button, index) => {
          button.addEventListener('click', () => {
            const currentUrl = new URL(window.location.href);
            currentUrl.searchParams.set('lesson', String(index));
            window.location.href = currentUrl.toString();
          });
        });
      }

      const questionDrawer = document.getElementById('scratchQuestionDrawer');
      const questionToggle = document.getElementById('scratchQuestionToggle');

      if (questionDrawer && questionToggle) {
        const updateDrawerState = (open) => {
          questionDrawer.classList.toggle('hidden', !open);
          questionToggle.setAttribute('aria-expanded', String(open));
          questionToggle.textContent = open ? 'Close' : 'Questions';
          questionToggle.title = open ? 'Hide questions' : 'Show questions';
        };

        questionToggle.addEventListener('click', () => {
          const isOpen = questionToggle.getAttribute('aria-expanded') === 'true';
          updateDrawerState(!isOpen);
        });

        updateDrawerState(true);
      }
    </script>
  </body>
</html>
